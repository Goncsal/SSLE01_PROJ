[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "evcorrelator"
version = "0.1.0"
description = "Incident correlator: joins Prometheus, Wazuh and fraud signals into one incident with a root cause."
requires-python = ">=3.13"
dependencies = [
    "evcommon",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "httpx>=0.27",
    "prometheus-client>=0.20,<1",
]

[project.optional-dependencies]
test = ["pytest>=8"]
pg = ["sqlalchemy>=2.0,<3", "psycopg[binary]>=3.1"]
history = ["sqlalchemy>=2.0,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
