apiVersion: v1
kind: Service
metadata:
  name: billing
  labels:
    app.kubernetes.io/name: billing
    app.kubernetes.io/part-of: evcharge
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "8002"
    prometheus.io/path: /metrics
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: billing
  ports:
    - name: http
      port: 8002
      targetPort: http
      nodePort: 30802
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing
  labels:
    app.kubernetes.io/name: billing
    app.kubernetes.io/part-of: evcharge
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: billing
  template:
    metadata:
      labels:
        app.kubernetes.io/name: billing
        app.kubernetes.io/part-of: evcharge
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8002"
        prometheus.io/path: /metrics
    spec:
      enableServiceLinks: false
      initContainers:
        - name: fix-log-dir
          image: docker.incus:5000/evcharge-billing
          imagePullPolicy: Always
          command: ["chown", "10001", "/var/log/evcharge"]
          securityContext:
            runAsUser: 0
            runAsNonRoot: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["CHOWN"]
          volumeMounts:
            - name: logs
              mountPath: /var/log/evcharge
      containers:
        - name: billing
          image: docker.incus:5000/evcharge-billing
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8002
          envFrom:
            - secretRef:
                name: billing-env
          env:
            - name: BIND_HOST
              value: "0.0.0.0"
            - name: LOG_DIR
              value: /var/log/evcharge
            - name: INSTANCE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: BILLING_LISTEN_PORT
              value: "8002"
            - name: BILLING_SEED_ROSTER
              value: /etc/evcharge/roster.yaml
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: logs
              mountPath: /var/log/evcharge
            - name: roster
              mountPath: /etc/evcharge
              readOnly: true
      volumes:
        - name: logs
          hostPath:
            path: /var/log/evcharge
            type: DirectoryOrCreate
        - name: roster
          configMap:
            name: roster
