apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: evcharge
resources:
  - namespace.yaml
  - postgres.yaml
  - registry.yaml
  - billing.yaml
  - csms.yaml
  # - fraud.yaml   # W7 RUN card: uncomment (after the fraud role/DB, image and fraud-env exist)
# The roster ConfigMap is created by infra/05_deploy.sh from dev/roster.yaml.
# infra/05_deploy.sh rewrites newTag in its pushed copy when IMAGE_TAG is set.
images:
  - name: docker.incus:5000/evcharge-registry
    newTag: latest
  - name: docker.incus:5000/evcharge-billing
    newTag: latest
  - name: docker.incus:5000/evcharge-csms
    newTag: latest
  - name: docker.incus:5000/evcharge-fraud
    newTag: latest
