[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "evregistry"
version = "0.1.0"
description = "Element registry of the EV charging network: delegation, locate and quarantine."
requires-python = ">=3.13"
dependencies = [
    "evcommon",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "sqlalchemy>=2.0,<3",
    "prometheus-client>=0.20,<1",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
pg = ["psycopg[binary]>=3.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
