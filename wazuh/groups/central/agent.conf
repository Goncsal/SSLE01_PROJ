<!-- Group central: the K3s nodes. The pod mounts the node's /var/log/evcharge read-only;
     there is one JSON file per pod (csms, registry, billing, fraud, correlator). -->
<agent_config>
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/evcharge/*.json</location>
  </localfile>
</agent_config>
