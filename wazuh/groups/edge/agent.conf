<!-- Group edge: the city gateways (nginx). The access events are JSON written by nginx;
     the error log carries the limit_req / limit_conn refusals (custom decoder on the manager). -->
<agent_config>
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/evcharge/edge-*.json</location>
  </localfile>
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/nginx/error.log</location>
  </localfile>
</agent_config>
