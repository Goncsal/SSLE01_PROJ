<!-- Group station: the charging stations. sim-*.json is the station controller's own log,
     netwatch.json the outbound-connection watcher; the socket table is also sampled once a
     minute so a change in the destinations outside the allow list raises a check_diff alert.
     full_command needs logcollector.remote_commands=1 on the agent (set by install_native.sh). -->
<agent_config>
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/evcharge/sim-*.json</location>
  </localfile>
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/evcharge/netwatch.json</location>
  </localfile>
  <localfile>
    <log_format>full_command</log_format>
    <command>/opt/evcharge/netwatch.py --sockets</command>
    <alias>station-sockets</alias>
    <frequency>60</frequency>
  </localfile>
</agent_config>
