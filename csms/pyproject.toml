[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "evcsms"
version = "0.1.0"
description = "OCPP 1.6J central system (CSMS) of the EV charging network: identity checks, sessions, meter checks and a command API."
requires-python = ">=3.13"
dependencies = [
    "evcommon",
    "ocpp",
    "websockets",
    "fastapi",
    "uvicorn",
    "sqlalchemy",
    "httpx",
    "prometheus-client",
]

[project.optional-dependencies]
test = ["pytest"]
pg = ["psycopg[binary]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
